<title>Schelesnogorsk Metro</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--tx:#1d1d1f;--sub:#6e6e73;--ln:#e3e3e8;--ac:#0072BA}
:root[data-theme=dark]{--bg:#1c1c1e;--card:#2c2c2e;--tx:#f2f2f7;--sub:#9a9aa0;--ln:#3a3a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 Inter,system-ui,Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:760px;margin:0 auto;padding:10px 12px 24px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:18px;margin:0;flex:1}
button,select{font:inherit;color:var(--tx)}
.ib{border:1px solid var(--ln);background:var(--card);border-radius:10px;min-width:42px;height:38px;font-weight:700;cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 3px #0001;margin-bottom:10px}
.mapc{background:#fff!important;padding:8px 6px}
#map{width:100%;height:auto;display:block}
.lb text,.ru{font:8px Inter,system-ui,Roboto,Arial,sans-serif;fill:#000}
.ru,.lang-ru .de{display:none}.lang-ru .ru{display:block}
.hit{fill:transparent;stroke:none;cursor:pointer}
.rt #base{opacity:.28}#base{transition:opacity .25s}#ov{pointer-events:none}
.mt{font:700 8px Inter,system-ui,Arial,sans-serif;fill:#fff}.on .ru{font-weight:700}
.fl{stroke:#fff;stroke-width:1.8;stroke-dasharray:1.5 5.5;stroke-linecap:round;fill:none;animation:fl .9s linear infinite}.fl.rv{animation-direction:reverse}
@keyframes fl{to{stroke-dashoffset:-7}}@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.rt .lb:not(.on){opacity:.28}
.row{display:flex;gap:8px;align-items:center}
.fields{flex:1;display:grid;gap:8px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
.sw{height:48px}
.sum{font-size:22px;font-weight:700}.sub{color:var(--sub);font-size:13px}
.chips{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.chip{color:#fff;border-radius:99px;padding:2px 11px;font-weight:700;font-size:13px}
.st{display:flex;align-items:center;gap:10px;padding:6px 0;position:relative}
.dot{width:12px;height:12px;border-radius:50%;border:3px solid;background:#fff;flex:none}
.tr{font-size:12px;color:var(--sub);margin-left:22px;padding:2px 0}
.hist button{margin:4px 6px 0 0;padding:6px 10px;border-radius:99px;border:1px solid var(--ln);background:var(--bg);cursor:pointer;font-size:13px}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;cursor:pointer}.seg .a{background:var(--ac);color:#fff}
.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin:10px 0;display:block}.ph.no{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--sub);border:1px dashed var(--ln)}#inf p{margin:0}
.clr{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-weight:600;cursor:pointer;color:#e5283a}
</style></head><body>

<script>
const L={1:'#FF0000',2:'#0072BA'};
const S={A1:['Awtozawodskaja','Автозаводская',1],A2:['Deutsche Sprachschule','Немецкая языковая школа',1],A3:['Stadtplatz','Городская площадь',1],A4:['Bahnhof Schelesnogorsk','Вокзал Железногорск',1],A5:['Stadtmarkt','Городской рынок',1],A6:['Bahnhof','Вокзал',1],B1:['Konzerthalle','Концертный зал',2],B2:['Brauerei','Пивоварня',2],B3:['Geschäftszentrum','Деловой центр',2],B4:['Vykhino','Выхино',2],B5:['Traktorenwerk','Тракторный завод',2]};
const E=[],adj={};Object.keys(S).forEach(k=>adj[k]=[]);
const add=(a,b,w,tr)=>{adj[a].push([b,w,tr]);adj[b].push([a,w,tr])};
['A1','A2','A3','A4','A5','A6'].reduce((p,c)=>(add(p,c,90),c));

ru:{title:'Schelesnogorsk Metro',from:'Откуда',to:'Куда',pick:'Выберите станцию',line:'Линия',tr:['пересадка','пересадки'],hint:'Нажмите на станцию на карте или выберите «Откуда» и «Куда».',hist:'Недавние поиски',clr:'Удалить маршрут',mr:'Маршрут',mi:'Осмотр',hintI:'Нажмите на станцию, чтобы увидеть фото и историю.',ph:'Фото скоро появится',hi:'История скоро появится.',same:'Начало и конец совпадают.',min:'мин',sec:'сек',st:'станций',xfer:'Пересадка на линию'}};
const ld=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const INFO={};/* INFO.A1={img:'data:image/jpeg;base64,...',de:'Geschichte',ru:'История'} */
let mode='r',sel='',lang=ld('smLang','de'),theme=ld('smTheme','light'),from='',to='',hist=[];
try{hist=JSON.parse(ld('smHist','[]'))}catch(e){}
const $=i=>document.getElementById(i),nm=k=>S[k][lang=='de'?0:1],tt=k=>T[lang][k];
function route(a,b){const d={[a]:0},pv={},q=new Set(Object.keys(S));
 while(q.size){let u=null;q.forEach(k=>{if(d[k]!==undefined&&(u===null||d[k]<d[u]))u=k});if(u===null||u==b)break;q.delete(u);
  adj[u].forEach(([v,w,tr])=>{if(q.has(v)&&(d[v]===undefined||d[u]+w<d[v])){d[v]=d[u]+w;pv[v]=[u,tr]}})}
 const p=[b];while(p[0]!=a)p.unshift(pv[p[0]][0]);return{p,t:d[b]}}
const C={A1:[32,192],A2:[124,192],A3:[216,192],A4:[308,192],A5:[400,192],A6:[492,192],B1:[220.5,25],B2:[220.64,117],B3:[308,176],B4:[394.5,117],B5:[394.5,25]};

const mk=(k,l,c)=>`<g transform="translate(${C[k]})"><circle r="8" fill="#1d1d1f"/><circle r="6.8" fill="${c}"/><text class="mt" y="2.9" text-anchor="middle">${l}</text></g>`;
function fit(){document.querySelectorAll('text.ru').forEach(e=>{e.style.fontSize='';e.style.display='block';const w=e.getComputedTextLength(),m=+e.dataset.mw;e.style.fontSize=w>m?(8*m/w).toFixed(2)+'px':'';e.style.display=''})}
function fmt(t){const m=Math.floor(t/60),s=t%60;return (m?m+' '+tt('min'):'')+(s?(m?' ':'')+s+' '+tt('sec'):'')}
function render(){
 document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;
 $('mc').firstChild;const m=$('map');m.classList.toggle('lang-ru',lang=='ru');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tt(e.dataset.t));
 $('lg').textContent=lang=='de'?'RU':'DE';$('lg').title=lang=='de'?'Русский':'Deutsch';$('th').textContent=theme=='dark'?'☀':'☾';
 const opt=v=>'<option value="">'+tt('pick')+'</option>'+Object.keys(S).map(k=>`<option value="${k}"${k==v?' selected':''}>${nm(k)}</option>`).join('');
 $('f').innerHTML=opt(from).replace('>'+tt('pick'),'>'+tt('from')+' — '+tt('pick'));$('t').innerHTML=opt(to).replace('>'+tt('pick'),'>'+tt('to')+' — '+tt('pick'));
 m.querySelectorAll('.lb').forEach(l=>l.classList.remove('on'));m.classList.remove('rt');let ov='';
 const r=$('res');
 if(!from||!to){r.innerHTML='<div class="sub">'+tt('hint')+'</div>';if(from)ov=mk(from,'A','#1faa59');if(to)ov+=mk(to,'B','#e5283a')}
 else if(from==to){r.innerHTML='<div class="sub">'+tt('same')+'</div>'}
 else{const{p,t}=route(from,to);m.classList.add('rt');
  p.forEach(k=>m.querySelector(`.lb[data-s=${k}]`).classList.add('on'));
  const o=[],c=[],f=[];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];let d=EP[a+'-'+b],rv=0;if(!d){d=EP[b+'-'+a];rv=1}
   const col=S[a][2]!=S[b][2]?'url(#paint0_linear_247_36)':L[S[a][2]];
   o.push(`<path d="${d}" stroke="#1d1d1f" stroke-width="11" stroke-linecap="round"/>`);c.push(`<path d="${d}" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`);f.push(`<path d="${d}" class="fl${rv?' rv':''}"/>`)}
  ov=o.join('')+c.join('')+f.join('')+p.slice(1,-1).map(k=>`<g transform="translate(${C[k]})"><circle r="7.5" fill="#1d1d1f"/><circle r="6" fill="${L[S[k][2]]}"/><circle r="3.5" fill="#fff"/></g>`).join('')+mk(from,'A','#1faa59')+mk(to,'B','#e5283a');
  const ls=[];p.forEach(k=>{const n=S[k][2];if(ls[ls.length-1]!=n)ls.push(n)});const x=ls.length-1;
  let h=`<div class="sum">~${fmt(t)}</div><div class="sub">${x} ${x==1?tt('tr')[0]:(lang=='ru'&&x>1&&x<5?tt('tr')[1]:tt('tr')[lang=='de'&&x!=1?1:0])} · ${p.length} ${tt('st')}</div><div class="chips">`+ls.map(n=>`<span class="chip" style="background:${L[n]}">${n}</span>`).join('')+'</div>';
  p.forEach((k,i)=>{if(i&&S[p[i-1]][2]!=S[k][2])h+=`<div class="tr">⇄ ${tt('xfer')} ${S[k][2]} · 30 ${tt('sec')}</div>`;h+=`<div class="st"><span class="dot" style="border-color:${L[S[k][2]]}"></span><span>${nm(k)}</span></div>`});
  r.innerHTML=h}
$('cl').hidden=!from&&!to;$('cl').textContent=tt('clr');
 const ins=mode=='i';['fc','res'].forEach(i=>$(i).hidden=ins);$('inf').hidden=!ins;
 $('m1').textContent=tt('mr');$('m2').textContent=tt('mi');$('m1').className=ins?'':'a';$('m2').className=ins?'a':'';
 if(ins){m.classList.remove('rt');m.querySelectorAll('.lb').forEach(l=>l.classList.remove('on'));ov='';
  if(sel){m.querySelector(`.lb[data-s=${sel}]`).classList.add('on');const n=S[sel][2],I=INFO[sel]||{};
   ov=`<g transform="translate(${C[sel]})"><circle r="9" fill="#1d1d1f"/><circle r="7.6" fill="${L[n]}"/><circle r="3.8" fill="#fff"/></g>`;
   $('inf').innerHTML=`<div class="row"><span class="chip" style="background:${L[n]}">${n}</span><div class="sum">${nm(sel)}</div></div>`+(I.img?`<img class="ph" src="${I.img}" alt="${nm(sel)}">`:`<div class="ph no">📷 ${tt('ph')}</div>`)+`<p>${I[lang]||'<span class="sub">'+tt('hi')+'</span>'}</p>`}
  else $('inf').innerHTML='<div class="sub">'+tt('hintI')+'</div>'}
 $('ov').innerHTML=ov;$('hs').hidden=!hist.length||ins;$('hl').innerHTML=hist.map((h,i)=>`<button data-i="${i}">${nm(h[0])} → ${nm(h[1])}</button>`).join('');
 requestAnimationFrame(fit)}
function go(){if(from&&to&&from!=to){const h=[from,to];hist=[h,...hist.filter(x=>x[0]!=from||x[1]!=to)].slice(0,5);sv('smHist',JSON.stringify(hist))}render()}
$('f').onchange=e=>{from=e.target.value;go()};$('t').onchange=e=>{to=e.target.value;go()};

$('th').onclick=()=>{theme=theme=='dark'?'light':'dark';sv('smTheme',theme);render()};
$('map').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.s;if(!k||!e.target.classList.contains('hit'))return;
